<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Converte Call — convite da equipe</title><link rel="stylesheet" href="/setup.css"><main><h1>Entre para a equipe</h1><p>Crie sua senha pessoal para acessar o Converte Call. Seu acesso usa o e-mail informado no convite e as permissões definidas pelo titular.</p><form id="join"><label>Crie sua senha<input name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><label>Confirme sua senha<input name="confirmation" type="password" required minlength="10" maxlength="200" autocomplete="new-password"></label><button>Aceitar convite e criar meu acesso</button></form><p id="status" role="status"></p><p class="muted">Use seu próprio e-mail e senha na extensão. Você não precisa conectar o WhatsApp do titular novamente.</p></main><script src="/join.js" defer></script></html>

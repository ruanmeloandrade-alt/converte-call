<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie sua conta · Converte Call</title><link rel="icon" href="/brand.svg"><link rel="stylesheet" href="/setup.css"><link rel="stylesheet" href="/password-fields.css"><script src="/site-guard.js" defer></script><script src="/password-fields.js" defer></script><script src="/setup.js" defer></script></head><body><main><div class="signup-top"><a href="/">Converte Call</a><a href="/" aria-label="Fechar cadastro">Fechar ✕</a></div><h1>Crie sua conta</h1><p id="intro">Seu teste de 7 dias começa aqui. Sem cartão.</p><form id="setup"><div id="profile-fields"><label>Nome<input name="name" autocomplete="name" required maxlength="160" placeholder="Seu nome"></label><label>WhatsApp<input name="whatsapp" type="tel" autocomplete="tel" required maxlength="25" placeholder="55 + DDD + número"></label><label>Instagram <small>(opcional)</small><input name="instagram" autocomplete="off" maxlength="31" placeholder="@seuperfil"></label></div><label>E-mail<input name="email" type="email" required autocomplete="username" maxlength="200"></label><label>Crie sua senha<input name="password" type="password" required minlength="10" maxlength="200" autocomplete="new-password" placeholder="Pelo menos 10 caracteres"></label><button>Criar conta e ir para o download</button></form><p id="status" role="status"></p><p id="hint" class="signup-note">Ao criar sua conta, você concorda com os <a href="/termos">Termos de uso</a> e a <a href="/privacidade">Política de privacidade</a>. Depois do cadastro, você vai para o download do aplicativo.</p><p class="signup-note">Já tem conta? <a href="/account">Entrar</a> · <a href="/esqueci-senha">Esqueci minha senha</a></p></main></body></html>

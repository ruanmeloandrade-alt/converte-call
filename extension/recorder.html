<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Converte Call • Iniciar gravação</title><link rel="stylesheet" href="surface.css"><link rel="stylesheet" href="recorder.css"><script src="core.js" defer></script><script src="core-v4.js" defer></script><script src="workspace.js" defer></script><script src="credential-vault.js" defer></script><script src="recording-analysis.js" defer></script><script src="ai-media.js" defer></script><script src="offscreen.js" defer></script><script src="recorder.js" defer></script><link rel="stylesheet" href="password-fields.css"><script src="password-fields.js" defer></script></head><body><header class="top"><span class="brand"><span class="logo"><i></i><i></i><i></i></span>Converte Call</span></header><main class="main"><h1>Gravar call, aula ou vídeo</h1><p class="details tiny muted">Escolha a fonte no seletor do Chrome. Esta janela ficará minimizada durante a gravação.</p><form id="capture"><label class="field">Título<input name="title" value="Minha gravação" required></label><label class="field">Tipo de conteúdo<select name="contentType"><option value="auto">Identificar automaticamente</option><option value="call">Call / reunião</option><option value="lesson">Videoaula / treinamento</option><option value="video">Vídeo / conteúdo</option></select></label><label class="field">Avanço do roteiro<select name="workflowAdvance"><option value="manual">Eu avanço as etapas</option><option value="ai">Permitir avanço pela IA</option></select></label><label class="field">Cliente<select name="lead" id="lead"><option value="">Sem cliente</option></select></label><label class="field">Workflow<select name="workflowId" id="workflow"><option value="none">Sem roteiro</option></select></label><label class="field">O que gravar<select name="mode"><option value="video">Tela e áudio</option><option value="screen">Somente tela</option><option value="audio">Somente áudio</option></select></label><label class="check"><input type="checkbox" name="mic" checked>Incluir meu microfone</label><label class="check"><input type="checkbox" name="system" checked>Incluir áudio compartilhado pelo Chrome</label><label class="check"><input type="checkbox" name="liveAI">Sugestões com minha API de IA</label><label class="check"><input type="checkbox" name="consent" required>Participantes informados sobre a gravação</label><button type="submit" class="primary wide" id="start">Iniciar e escolher tela</button></form><div id="progress" hidden><p class="status red" id="record-status">Gravando</p><p class="details tiny">Mantenha esta janela aberta. Ela pode ficar minimizada.</p><button class="primary wide details" id="stop">Parar e salvar no computador</button></div><div class="error details" id="error" role="alert" hidden></div><div class="hint details" id="warnings" hidden></div><details class="details"><summary>Diagnóstico de captura</summary><pre id="diagnostic"></pre></details></main></body></html>
